<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus UI - Premium Directory & Showcase Kit</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-40 w-full backdrop-blur-md bg-slate-900/70 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/20">
          N
        </div>
        <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
          Nexus UI
        </span>
      </div>

      <div class="flex items-center gap-3">
        <button id="themeToggleBtn" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-all">
          <i class="fa-solid fa-moon text-sm"></i>
        </button>
        <button class="px-4 py-2 text-xs font-semibold rounded-lg bg-brand-600 hover:bg-brand-500 text-white shadow-lg shadow-brand-600/30 transition-all">
          Get Template
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-12 px-4 max-w-7xl mx-auto text-center">
    <span class="px-3 py-1 text-xs font-medium bg-brand-500/10 text-brand-400 border border-brand-500/20 rounded-full inline-block mb-4">
      v1.0 Release ready
    </span>
    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-slate-100 max-w-2xl mx-auto leading-tight">
      Explore High-Performance Web Services & Components
    </h1>
    <p class="mt-3 text-sm sm:text-base text-slate-400 max-w-lg mx-auto">
      Discover, filter, and integrate curated tools built for modern web applications.
    </p>

    <!-- Search Bar & Filters -->
    <div class="mt-8 max-w-xl mx-auto space-y-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by name, tags, or technology..." 
          class="w-full pl-11 pr-4 py-3 bg-slate-900/90 border border-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent placeholder-slate-500 shadow-inner text-slate-200 transition-all"
        />
      </div>

      <!-- Category Filter Pills -->
      <div class="flex items-center justify-center gap-2 flex-wrap text-xs" id="categoryFilters">
        <button class="filter-btn active px-3 py-1.5 rounded-lg bg-brand-600 text-white font-medium transition-all" data-category="all">All</button>
        <button class="filter-btn px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 font-medium transition-all" data-category="ui">UI Components</button>
        <button class="filter-btn px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 font-medium transition-all" data-category="tools">Tools & Scripts</button>
        <button class="filter-btn px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 font-medium transition-all" data-category="templates">Templates</button>
      </div>
    </div>
  </section>

  <!-- Dynamic Content Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic cards rendered via script.js -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
